[package]
name = "p2p"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "All-in-one libp2p server for AOL2 peer discovery, gossip, session routing, and relay fallback."
publish = false

[lib]
name = "p2p"
path = "src/lib.rs"

[[example]]
name = "p2p_server"
path = "examples/p2p_server.rs"
test = false
bench = false

[[test]]
name = "windows_build"
path = "unit_tests/windows_build.rs"

[[test]]
name = "swarm_smoke"
path = "unit_tests/swarm_smoke.rs"

[[test]]
name = "pulse_validation"
path = "unit_tests/pulse_validation.rs"

[dependencies]
futures.workspace = true
libp2p = { workspace = true, default-features = false, features = [
    "tokio",
    "dns",
    "tcp",
    "noise",
    "yamux",
    "quic",
    "websocket",
    "gossipsub",
    "kad",
    "mdns",
    "identify",
    "ping",
    "relay",
    "autonat",
    "dcutr",
    "macros",
] }
blake3.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
